<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FAQ Chatbot - Context-Aware Intelligent Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="main-wrapper">
        <div class="chat-card">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <div class="bot-logo">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="header-text">
                        <h1>AI FAQ Chatbot</h1>
                        <span class="subtitle">Context-Aware Intelligent Assistant</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="clear-btn" class="action-btn" title="Clear History">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button id="theme-toggle" class="action-btn" title="Toggle Theme">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages / Welcome Area -->
            <div class="chat-messages" id="chat-messages">
                <div class="message bot-message">
                    <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        <h3>Welcome 👋</h3>
                        <p>I'm your AI FAQ Assistant. Ask me anything related to AI, Machine Learning, Python, Flask, NLP, Deep Learning, Data Science and more.</p>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                <div class="typing-bubble">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <!-- Suggested Questions Pills (Between messages and input) -->
            <div class="suggestions-container">
                <div class="suggestions-scroll" id="suggestions-list">
                    <button class="suggestion-chip">What is Artificial Intelligence?</button>
                    <button class="suggestion-chip">Explain Machine Learning</button>
                    <button class="suggestion-chip">What is Flask?</button>
                    <button class="suggestion-chip">Explain NLP</button>
                    <button class="suggestion-chip">What is Python?</button>
                </div>
            </div>

            <!-- Input Area -->
            <footer class="chat-input-area">
                <form id="chat-form">
                    <div class="input-wrapper">
                        <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" required>
                        <button type="submit" id="send-btn" title="Send">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </footer>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
